*{box-sizing:border-box;margin:0;padding:0}
body{
  margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;

}

p{color:var(--muted);font-weight:300;font-size:16px;max-width:440px;margin:0 auto 36px;line-height:1.7}
.links{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.btn{

  text-decoration:none;font-weight:600;font-size:14.5px;transition:transform .2s;
}
.btn-primary{background:linear-gradient(120deg,var(--gold),#e9c884);color:#1a1206}
.btn-ghost{background:var(--card);border:1px solid var(--card-border);color:var(--text)}
.btn:hover{transform:translateY(-3px)}
